name: medinav-ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup ROS 2 Humble
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ros-humble-gazebo-ros-pkgs \
            ros-humble-gazebo-ros2-control \
            ros-humble-ros2-control \
            ros-humble-ros2-controllers \
            ros-humble-navigation2 \
            ros-humble-nav2-bringup \
            ros-humble-slam-toolbox \
            ros-humble-xacro \
            python3-colcon-common-extensions \
            python3-rosdep
          rosdep update
          rosdep install --from-paths src --ignore-src -r -y

      - name: Build
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --symlink-install --event-handlers console_direct+

      - name: Xacro check
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          xacro src/medinav_description/urdf/medibot.urdf.xacro \
            controller_yaml:=$(pwd)/src/medinav_navigation/config/diff_drive_controller.yaml \
            > /tmp/medibot.urdf
          echo "URDF OK: $(wc -l < /tmp/medibot.urdf) lines"

      - name: Map artifact check
        run: |
          test -f src/medinav_navigation/maps/hospital_mini.pgm
          test -f src/medinav_navigation/maps/hospital_mini.yaml
